    <meta name="theme-color" content="#f4ede1" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the saved theme choice (src/lib/theme.js) before the first paint.
      try {
        var t = localStorage.getItem('plywood-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', t === 'light' ? '#f4ede1' : '#17120e')
          })
        }
      } catch (e) {}
    </script>
